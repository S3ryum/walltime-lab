name: Bug report
description: Report incorrect or confusing transition output.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: walltime-lab version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: zone
    attributes:
      label: IANA zone and year
      placeholder: Europe/Amsterdam, 2026
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual output
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Python version, OS, and time-zone data source
    validations:
      required: true
